# One crisium sentinel per application. Copy .env.example to .env and fill it in, then:
#   docker compose up -d --build
# Several applications: run one project per application (docker compose -p <name> --env-file <file> up -d).
services:
  sentinel:
    build:
      context: .
    image: crisium-sentinel:local
    restart: unless-stopped
    env_file: .env
    volumes:
      - data:/data
    logging:
      driver: json-file
      options:
        max-size: 50m
        max-file: "5"

volumes:
  data:
